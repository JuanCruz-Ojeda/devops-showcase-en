# ---------------------------------------------------------------------------
# App of Apps
# ---------------------------------------------------------------------------
# This is the ONLY Application a human ever applies by hand (once). It points
# at gitops/argocd/apps/, and ArgoCD itself creates every Application it
# finds in there. Adding a new service later means adding one YAML file
# here, not touching the cluster directly.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/JuanCruz-Ojeda/devops-showcase-en.git
    targetRevision: feat/eks-terraform-gitops
    path: gitops/argocd/apps

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true # remove resources deleted from Git
      selfHeal: true # revert manual changes made straight on the cluster
    syncOptions:
      - CreateNamespace=true
