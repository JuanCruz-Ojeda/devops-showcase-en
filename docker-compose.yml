# Brings the whole stack up with a single command:  docker compose up --build
#
# The "version:" key is obsolete in Compose v2 and was removed on purpose.

# Fixed project name: this way the containers/network/volume are named
# "mini-app-*" regardless of the folder name the repo is cloned into.
name: mini-app

services:
  app:
    build:
      context: ./app
      pull: true          # pull a fresh base image (avoids CVEs from a stale cache)
    # Host 8080 -> container 5000 (where gunicorn listens).
    ports:
      - "8080:5000"
    # The app needs to know where Redis lives. Inside the compose network the
    # host is the service name ("redis"). It can be overridden with a .env.
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    # Don't start the app until Redis is actually ready (not just "created").
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly: persist to disk so the counter isn't lost across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
