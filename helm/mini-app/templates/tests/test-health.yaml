{{/*
Chart test. "helm test <release>" creates this Pod; if it exits 0, the test
passes. The helm.sh/hook=test annotation is what marks it as a test.
It checks that the app responds and that /cache-test works (i.e. that the app
reaches Redis with the password from the Secret).
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mini-app.fullname" . }}-test-health"
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    # before-hook-creation: deletes the previous test pod right before creating
    # a new one. We do not use "hook-succeeded" so we can inspect the logs
    # afterwards (helm test --logs or kubectl logs mini-app-test-health).
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # curlimages/curl already runs non-root by default (uid 100, gid 101).
  # No probes on purpose: this is a one-shot pod that runs and exits in seconds,
  # not a long-running service (readiness/liveness do not apply here).
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      command:
        - sh
        - -c
        - |
          set -e
          base="http://{{ include "mini-app.fullname" . }}:{{ .Values.app.service.port }}"
          echo "GET $base/health";     curl -fsS "$base/health"; echo
          echo "GET $base/cache-test"; curl -fsS "$base/cache-test"; echo
