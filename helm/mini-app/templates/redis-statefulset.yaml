{{/*
Redis as a StatefulSet (1 replica):
- stable identity (pod "<name>-0", PVC "data-<name>-0")
- volumeClaimTemplates -> each replica gets its own persistent PVC
- password via Secret (never in the manifest in plain text)

Persistence rationale: the "hits" counter is the app's only observable state and
docker-compose already persists it. It gives durability against pod restarts,
NOT against node loss or PVC deletion. Real HA = Sentinel/Cluster or a managed
service (see infra/README.md, ElastiCache).
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mini-app.redis.fullname" . }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "mini-app.redis.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mini-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "mini-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # redis:7-alpine already ships an unprivileged "redis" user (uid 999,
      # gid 1000); we declare it to Kubernetes. fsGroup is what makes the PVC
      # writable by that gid when it is mounted (otherwise Redis could not
      # write /data running as non-root).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["redis-server"]
          args:
            - --requirepass
            - $(REDIS_PASSWORD)     # k8s substitutes the var (defined in env)
            - --appendonly
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mini-app.redis.secretName" . }}
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | quote }}
