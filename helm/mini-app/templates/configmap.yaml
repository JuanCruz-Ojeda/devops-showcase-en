{{/*
NON-sensitive app config. The app receives it as environment variables
(see envFrom in app-deployment.yaml). Nothing hardcoded in the Deployment.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mini-app.fullname" . }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
data:
  # The app resolves Redis by the Service name (cluster-internal DNS).
  REDIS_HOST: {{ include "mini-app.redis.fullname" . | quote }}
  REDIS_PORT: "6379"
