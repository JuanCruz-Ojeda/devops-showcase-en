{{/*
The app (Flask + gunicorn). Stateless -> Deployment with N replicas.
Config via environment variables:
  - REDIS_HOST / REDIS_PORT  <- ConfigMap (envFrom)
  - REDIS_PASSWORD           <- Secret (explicit mapping: the Secret key is
                                 "redis-password" and the env var is "REDIS_PASSWORD")
Probes against /health (an endpoint the app already exposes).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini-app.fullname" . }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "mini-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "mini-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      # Hardened based on what Checkov (helm framework) found — see
      # security/README.md. The image already runs non-root (uid 10001, see
      # app/Dockerfile); this declares it to Kubernetes as well.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false   # the app does not call the k8s API
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "mini-app.fullname" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mini-app.redis.secretName" . }}
                  key: redis-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
