{{/*
Redis password. Priority:
  1. .Values.redis.auth.password if it has a value (handy for --set in the demo)
  2. the Secret already present in the cluster (lookup) -> reused, so the password
     is STABLE across 'helm upgrade' (otherwise every upgrade would rotate it and
     Redis would become unreachable for the old pods)
  3. if it does not exist (first install): a random one is generated

Caveat: 'helm template' runs WITHOUT a cluster, so lookup returns empty and in
that mode you see a new password on every render. In 'helm install/upgrade'
(which do talk to the cluster) the behavior is correct.
*/}}
{{- $secretName := include "mini-app.redis.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $password := "" -}}
{{- if .Values.redis.auth.password -}}
  {{- $password = .Values.redis.auth.password -}}
{{- else if and $existing $existing.data (hasKey $existing.data "redis-password") -}}
  {{- $password = (index $existing.data "redis-password" | b64dec) -}}
{{- else -}}
  {{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ $password | b64enc | quote }}
