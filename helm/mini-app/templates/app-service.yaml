{{/*
App Service. ClusterIP by default: reachable inside the cluster, and from
outside via "kubectl port-forward" or "minikube service".
Load-balances across all Deployment replicas.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mini-app.fullname" . }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "mini-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
