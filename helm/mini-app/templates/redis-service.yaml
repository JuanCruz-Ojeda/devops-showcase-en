{{/*
Headless Service (clusterIP: None) for the Redis StatefulSet.
"headless" = the Service DNS resolves straight to the pod IP, no load balancing.
That is what you want for stateful workloads: you want to talk to "that" Redis,
not to "some" member of a pool. The app uses this name as REDIS_HOST.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mini-app.redis.fullname" . }}
  labels:
    {{- include "mini-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "mini-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
