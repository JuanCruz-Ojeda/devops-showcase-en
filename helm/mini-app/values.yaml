# Default values for the mini-app chart.
# Override with:  -f other-values.yaml   or   --set key=value

# --- App image ---
image:
  # Local (minikube image load):  mini-app
  # GHCR (private, requires an imagePullSecret):
  #   ghcr.io/juancruz-ojeda/entrega-prueba-tecnica
  repository: mini-app
  tag: dev
  # IfNotPresent -> use the image already loaded on the node, don't pull.
  pullPolicy: IfNotPresent

# Secrets for pulling from private registries. e.g. [{ name: ghcr }]
imagePullSecrets: []

# Let you change the resource names without touching the release name.
nameOverride: ""
fullnameOverride: ""

# --- Application (Deployment, stateless) ---
app:
  replicaCount: 1              # parameter required by the track: horizontal scaling
  service:
    type: ClusterIP
    port: 5000                 # Service port (and container port)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# --- Redis (StatefulSet, stateful) ---
redis:
  image: redis:7-alpine
  auth:
    # Empty -> the chart generates a random password and preserves it across upgrades.
    # With a value -> that value is used (handy for --set in the demo).
    password: ""
  persistence:
    size: 128Mi
    storageClass: ""           # "" -> cluster default StorageClass
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
