name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs of the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions: read the repo only.
permissions:
  contents: read

jobs:
  # ===================================================================
  # Lint + build + smoke test. Always runs (push and PRs).
  # ===================================================================
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.5
          ruff check .

      - name: Build + smoke test (docker compose)
        run: |
          docker compose up -d --build
          ./scripts/smoke-test.sh http://localhost:8080

      - name: Compose logs (if something failed)
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # ===================================================================
  # Security scan. Runs on push and PRs, in parallel with build-test.
  #  - Trivy: image vulnerabilities (CVEs). BLOCKS on CRITICAL/HIGH
  #    with a fix available (--ignore-unfixed).
  #  - Checkov: IaC misconfiguration (Dockerfile / Helm / Actions). Does
  #    NOT block (soft-fail in .checkov.yaml), reports only.
  # Both upload results to the Security > Code scanning tab.
  # Thresholds and accepted findings: security/README.md.
  # ===================================================================
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v7

      # --- image to scan ---
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (to scan)
        uses: docker/build-push-action@v7
        with:
          context: ./app
          load: true
          pull: true            # fresh base image -> no CVEs from a stale cache
          tags: mini-app:scan

      # --- Trivy: full report (does not block) + upload to Security ---
      - name: Trivy - SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mini-app:scan
          scanners: vuln
          format: sarif
          output: trivy.sarif
          trivyignores: .trivyignore
          exit-code: "0"
      # Uploading to "Security > Code scanning" only works on public repos
      # (or with GitHub Advanced Security). continue-on-error so the job does
      # not fail if the repo is private — the report still lands in the job log.
      - name: Upload Trivy to Security
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      # --- Trivy: gate (DOES block) ---
      - name: Trivy - gate CRITICAL/HIGH with fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mini-app:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      # --- Checkov: IaC misconfiguration (does not block) ---
      - uses: azure/setup-helm@v5        # Checkov needs helm to render the chart
      - name: helm lint (bonus, since helm is here)
        run: helm lint helm/mini-app
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Checkov
        run: |
          pip install checkov==3.3.16
          checkov --config-file .checkov.yaml
      - name: Upload Checkov to Security
        if: always()
        continue-on-error: true      # see the note in the Trivy step
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

  # ===================================================================
  # Image publish. Only on push to main and only if build-test passed.
  # Registry: GHCR (ghcr.io), authenticated with the GITHUB_TOKEN that
  # Actions already provides (no extra secrets).
  #
  # Deploying to AWS follows the same path: swap the login for
  # aws-actions/configure-aws-credentials (OIDC) + aws-actions/amazon-ecr-login,
  # push to ECR and trigger "aws ecs update-service --force-new-deployment".
  # The detail is in infra/README.md.
  # ===================================================================
  publish:
    needs: [build-test, security-scan]   # don't publish an image that didn't pass Trivy's gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          pull: true            # fresh base image on every publish
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
