# Checkov config (IaC misconfiguration scanning).
#
# soft-fail: true  -> Checkov NEVER fails the pipeline.
# Reason: these are best-practice rules, more subjective and with more false
# positives across frameworks than Trivy's vulnerabilities. They exist for
# visibility (Security > Code scanning tab) and human review, not to block.
# The remaining findings and why they are accepted are in security/README.md.
# (Trivy, by contrast, DOES block on CRITICAL/HIGH with a fix.)

directory:
  - .

framework:
  - dockerfile
  - helm
  - github_actions

soft-fail: true
compact: true
quiet: true   # in the CI log, only the findings and the summary (not the PASSED ones)

# SARIF for GitHub's Security > Code scanning tab.
# (The full finding detail lives there; the CI log keeps the summary.)
output:
  - sarif
output-file-path: checkov-results
